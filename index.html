    <script>
      // Page loader mode, decided before first paint. First visit in a session gets the full branded intro
      // ("has-intro"); later visits stay quiet unless loading is actually slow (see the loader script in <body>).

      :root { --ld-bg: #111411; --ld-ink: #f0f0e8; --ld-muted: #a7ada5; --ld-accent: #8da5ff; --ld-halo: rgba(141, 165, 255, .13); --ld-line: rgba(226, 232, 223, .14); --ld-grid: rgba(201, 213, 201, .045); --ld-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
      :root[data-theme="light"] { --ld-bg: #f7f8fb; --ld-ink: #17212f; --ld-muted: #475569; --ld-accent: #3156b5; --ld-halo: rgba(49, 86, 181, .1); --ld-line: rgba(15, 23, 42, .14); --ld-grid: rgba(15, 23, 42, .045); }

    <div id="page-loader" role="status" aria-live="polite">

    <script>
      // Page loader: tracks real loading work (styles, fonts, app start-up, hero preview) and lifts like a
      // curtain once everything is ready. It never holds the page longer than MAX_WAIT_MS.
      (function () {
        var html = document.documentElement;
        var loader = document.getElementById("page-loader");
        if (!loader || !html.classList.contains("is-loading")) return;

        var MIN_INTRO_MS = 600;
        var QUIET_SHOW_AFTER_MS = 350;
        var QUIET_MIN_VISIBLE_MS = 500;
        var MAX_WAIT_MS = 8000;

        var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var introMode = html.classList.contains("has-intro");
        var percentEl = document.getElementById("page-loader-percent");
        var statusEl = document.getElementById("page-loader-status");
        var startedAt = performance.now();
        var shownAt = startedAt;
        var eased = 0;
        var displayed = 0;
        var finished = false;
        var mediaWatched = false;
        var tasks = [
          { id: "styles", weight: 30, label: "Loading interface", done: false },
          { id: "fonts", weight: 20, label: "Loading typography", done: false },
          { id: "app", weight: 35, label: "Starting up", done: false },
          { id: "media", weight: 15, label: "Loading previews", done: false }
        ];

        function markDone(id) { for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) tasks[i].done = true; }
        function isDone(id) { for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) return tasks[i].done; return true; }
        function realProgress() { var total = 0; for (var i = 0; i < tasks.length; i++) if (tasks[i].done) total += tasks[i].weight; return total; }
        function isShown() { return html.classList.contains("has-intro"); }
        // A quiet (repeat) visit only needs styles and fonts; a visible loader waits for everything.
        function requiredDone() { return isDone("styles") && isDone("fonts") && (!isShown() || (isDone("app") && isDone("media"))); }

        if (document.fonts && document.fonts.load) {
          Promise.all([document.fonts.load('500 1em "Space Grotesk"'), document.fonts.load('400 1em "DM Sans"')])
            .then(function () { markDone("fonts"); }, function () { markDone("fonts"); });
          setTimeout(function () { markDone("fonts"); }, 3000);
        } else {
          markDone("fonts");
        }

        // Wait for the hero preview image when it is on screen (it is hidden on phones).
        function watchMedia() {
          if (mediaWatched) return;
          mediaWatched = true;
          var image = document.querySelector(".hero-work-media img");
          if (!image || image.complete || image.offsetParent === null) return markDone("media");
          var done = function () { markDone("media"); };
          image.addEventListener("load", done, { once: true });
          image.addEventListener("error", done, { once: true });
          setTimeout(done, 4000);
        }

        function render(value) {
          loader.style.setProperty("--ld-p", value.toFixed(2));
          var rounded = String(Math.round(value));
          if (percentEl.textContent !== rounded) percentEl.textContent = rounded;
          var label = "Ready";
          for (var i = 0; i < tasks.length; i++) if (!tasks[i].done) { label = tasks[i].label; break; }
          if (statusEl.textContent !== label) statusEl.textContent = label;
        }

        function finish() {
          if (finished) return;
          finished = true;
          for (var i = 0; i < tasks.length; i++) tasks[i].done = true;
          render(100);
          try { sessionStorage.setItem("ck-intro-seen", "1"); } catch (error) {}
          var shown = isShown();
          var curtain = shown && !reduceMotion;
          var exitMs = curtain ? 800 : 320;
          setTimeout(function () {
            loader.classList.add("is-leaving", curtain ? "is-exiting" : "is-fading");
            html.classList.remove("is-loading");
            if (shown) html.classList.add("is-revealing");
            setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, exitMs);
            setTimeout(function () { html.classList.remove("is-revealing"); }, exitMs + 1200);
          }, shown ? 100 : 0);
        }

        function tick(now) {
          if (finished) return;
          try {
            var elapsed = now - startedAt;
            if (!isDone("styles") && getComputedStyle(html).getPropertyValue("--css-ready").trim() === "1") markDone("styles");
            if (!isDone("app") && html.hasAttribute("data-app-ready")) markDone("app");
            if (isDone("styles") && isDone("app")) watchMedia();

            var real = realProgress();
            // Creep forward while work is pending, so the meter never looks frozen on a slow network.
            var creep = real < 100 ? (100 - real) * 0.5 * (1 - Math.exp(-elapsed / 2400)) : 0;
            var target = Math.min(real < 100 ? 97 : 100, real + creep);
            // Chase the target smoothly, and close the gap quickly once every task is done.
            eased = reduceMotion ? target : eased + (target - eased) * (real >= 100 ? 0.5 : 0.25);
            if (target - eased < 0.3) eased = target;
            var value = eased;
            // First visit: the counter runs on an ease-out clock and lands on 100 exactly at MIN_INTRO_MS.
            if (introMode) value = Math.min(value, (1 - Math.pow(1 - Math.min(1, elapsed / MIN_INTRO_MS), 3)) * 100);
            displayed = Math.max(displayed, value);
            render(displayed);

            if (!isShown() && !requiredDone() && elapsed > QUIET_SHOW_AFTER_MS) {
              html.classList.add("has-intro");
              shownAt = now;
            }
            var shownLongEnough = introMode || now - shownAt >= QUIET_MIN_VISIBLE_MS;
            var ready = requiredDone() && (!isShown() || (displayed >= 100 && shownLongEnough));
            if (ready || elapsed > MAX_WAIT_MS) return finish();
          } catch (error) {
            return finish();
          }
          requestAnimationFrame(tick);
        }

        render(0);
        requestAnimationFrame(tick);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
